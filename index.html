<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>식이형제 라이브</title>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-14G9P2KSJ1"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-14G9P2KSJ1');

    function trackClick(eventName, buttonName, linkUrl) {
      gtag('event', eventName, {
        event_category: 'landing_button',
        button_name: buttonName,
        link_url: linkUrl,
        transport_type: 'beacon'
      });
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .wrapper {
      position: relative;
      width: 100%;
      max-width: 891px;
      margin: 0 auto;
    }

    @media (min-width: 900px) {
      .wrapper {
        width: 45%;
        max-width: 720px;
      }
    }

    .wrapper img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 클릭 영역 공통 */
    .click-zone {
      position: absolute;
      left: 11.5%;
      width: 77%;
      display: block;
      cursor: pointer;
      z-index: 10;
    }

    /* 1. 지금 생방송 보기 */
    .zone1 {
      top: 55.7%;
      height: 8.6%;
    }

    /* 2. 지난 방송 다시보기 */
    .zone2 {
      top: 64.8%;
      height: 8.6%;
    }

    /* 3. 오늘의 방송 일정 */
    .zone3 {
      top: 73.9%;
      height: 8.6%;
    }

    /* 4. 커뮤니티 문의 */
    .zone4 {
      top: 83.3%;
      height: 8.6%;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <!-- 랜딩 이미지 -->
    <img
      src="./landing.jpg"
      alt="식이형제 라이브 랜딩페이지"
    />

    <!-- 1. 지금 생방송 보기 -->
    <a
      class="click-zone zone1"
      href="https://open.kakao.com/o/g97TJLJi"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="지금 생방송 보기"
      onclick="trackClick(
        'live_click',
        '지금 생방송 보기',
        this.href
      )">
    </a>

    <!-- 2. 지난 방송 다시보기 -->
    <a
      class="click-zone zone2"
      href="https://www.youtube.com/@%E8%9F%B9%E9%BB%84%E5%AE%9D_Ixbn"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="지난 방송 다시보기"
      onclick="trackClick(
        'replay_click',
        '지난 방송 다시보기',
        this.href
      )">
    </a>

    <!-- 3. 오늘의 방송 일정 -->
    <a
      class="click-zone zone3"
      href="https://telegram.me/storyinquiry"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="오늘의 방송 일정"
      onclick="trackClick(
        'schedule_click',
        '오늘의 방송 일정',
        this.href
      )">
    </a>

    <!-- 4. 커뮤니티 문의 -->
    <a
      class="click-zone zone4"
      href="https://open.kakao.com/o/s266v8Ag"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="커뮤니티 문의"
      onclick="trackClick(
        'community_click',
        '커뮤니티 문의',
        this.href
      )">
    </a>

  </div>

</body>
</html>
